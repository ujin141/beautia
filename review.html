<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>후기 남기기 · Beautia</title>
<link rel="icon" href="/logo-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" integrity="sha384-SN6A48CJQjx946+DRb8wsoifC4a8ur9ZS6R+HCTgnBHOKCa6GLXAR3Qn8d1jztxg" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&display=swap">
<style>
:root{
  --ink:#191512;--sub:#736c64;--line:#eae5df;--bg:#ffffff;--soft:#f3f0eb;
  --plum:#221e1a;--gold-d:#A17C33;--rosebg:#f2efea;
  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:14px;
  --fs-lg:16px;--fs-xl:18px;--fs-2xl:22px;--fs-3xl:26px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-pill:999px;
  --sh-1:0 1px 2px rgba(20,12,16,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;padding:0 var(--sp-4) 48px;}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{display:block}

.top{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);padding:var(--sp-6) 0 var(--sp-5)}
.top img{height:26px;width:auto}
.top b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:var(--fs-xl);line-height:1.1;color:var(--plum)}

.card{max-width:440px;margin:0 auto}
.who{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);
  border:1px solid var(--line);border-radius:var(--r-md);background:#fff}
.who .av{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--soft) center/cover no-repeat}
.who .nm{font-size:var(--fs-lg);font-weight:700;line-height:1.25}
.who .ar{margin-top:2px;font-size:var(--fs-base);color:var(--sub)}

h1{margin:var(--sp-6) 0 var(--sp-2);font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.3}
.lead{font-size:var(--fs-md);color:var(--sub);line-height:1.6}

.lbl{margin:var(--sp-6) 0 var(--sp-2);font-size:var(--fs-base);font-weight:700}
.stars{display:flex;gap:var(--sp-2)}
.stars button{font-size:34px;line-height:1;color:var(--line);transition:color .12s,transform .12s}
.stars button.on{color:var(--gold-d)}
.stars button:active{transform:scale(.88)}

textarea,input{width:100%;font-family:inherit;font-size:var(--fs-lg);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-3);background:#fff;outline:none}
textarea{min-height:132px;resize:vertical;line-height:1.6}
textarea:focus,input:focus{border-color:var(--plum)}
.cnt{margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--sub);text-align:right}

.send{width:100%;margin-top:var(--sp-6);padding:15px;border-radius:var(--r-pill);
  background:var(--plum);color:#fff;font-size:var(--fs-lg);font-weight:700}
.send[disabled]{opacity:.4;cursor:default}
.note{margin-top:var(--sp-3);font-size:var(--fs-base);color:var(--sub);text-align:center;line-height:1.6}
.err{margin-top:var(--sp-3);font-size:var(--fs-md);color:#B3261E;text-align:center;line-height:1.6}

.state{max-width:440px;margin:64px auto;text-align:center}
.state .ic{font-size:44px;line-height:1}
.state h2{margin-top:var(--sp-4);font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em}
.state p{margin-top:var(--sp-2);font-size:var(--fs-md);color:var(--sub);line-height:1.7}
.state a{display:inline-block;margin-top:var(--sp-5);padding:12px 22px;border-radius:var(--r-pill);
  border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:var(--fs-md);font-weight:700}
.hide{display:none!important}
</style>
</head>
<body>

<div class="top"><img src="/logo-mark.png" alt=""><b>Beautia</b></div>

<!-- 불러오는 중 -->
<div id="loading" class="state"><p>불러오는 중…</p></div>

<!-- 작성 -->
<div id="form" class="card hide">
  <div class="who">
    <div class="av" id="av"></div>
    <div><div class="nm" id="nm"></div><div class="ar" id="ar"></div></div>
  </div>

  <h1>시술은 어떠셨어요?</h1>
  <p class="lead">남겨주신 후기는 이 디자이너를 찾는 다음 손님에게 그대로 보여요.</p>

  <div class="lbl">별점</div>
  <div class="stars" id="stars"></div>

  <div class="lbl">어떤 점이 좋았나요?</div>
  <textarea id="body" maxlength="1000" placeholder="예) 원하는 스타일을 잘 잡아주셨어요. 시술 내내 편했고 결과도 마음에 들어요."></textarea>
  <div class="cnt"><span id="cnt">0</span> / 1000</div>

  <div class="lbl">표시할 이름 <span style="font-weight:500;color:var(--sub)">(선택)</span></div>
  <input id="name" maxlength="24" placeholder="비워두면 ‘손님’으로 표시돼요">

  <button class="send" id="send">후기 남기기</button>
  <div class="note">계정을 만들지 않아도 돼요. 한 번만 보낼 수 있어요.</div>
  <div class="err hide" id="err"></div>
</div>

<!-- 완료 / 오류 -->
<div id="done" class="state hide">
  <div class="ic">🤍</div>
  <h2>후기 고마워요</h2>
  <p id="doneSub"></p>
  <a href="/community">Beautia 둘러보기</a>
</div>

<div id="bad" class="state hide">
  <div class="ic">🔗</div>
  <h2 id="badTitle">링크를 열 수 없어요</h2>
  <p id="badSub"></p>
  <a href="/community">Beautia 둘러보기</a>
</div>

<script>
var SB_URL='https://pzbxcktaljhesrfnqwzq.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6Ynhja3RhbGpoZXNyZm5xd3pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNjc1MjYsImV4cCI6MjA4Mzc0MzUyNn0.aUZbTgfWbjEISNr1-cu9YJnOGj1lzjXeRVifHygAplc';
var FN=SB_URL+'/functions/v1/review-guest';

function $(id){return document.getElementById(id);}
function show(id){['loading','form','done','bad'].forEach(function(k){$(k).classList.toggle('hide',k!==id);});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var T=(new URLSearchParams(location.search)).get('t')||'';
var STARS=0, sending=false;

// fetch 는 서버가 없거나 인터넷이 끊기면 예외를 던진다. 여기서 안 잡으면
// 호출한 쪽이 통째로 죽어 화면이 '불러오는 중…'에서 영영 멈춘다.
async function call(payload){
  var r;
  try{
    r=await fetch(FN,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify(Object.assign({t:T},payload))});
  }catch(e){
    return {ok:false,offline:true,data:{error:'연결에 실패했어요. 인터넷을 확인하고 다시 시도해 주세요.'}};
  }
  var j=await r.json().catch(function(){return {error:'잠시 후 다시 시도해 주세요.'};});
  return {ok:r.ok,data:j};
}

function bad(title,sub){$('badTitle').textContent=title;$('badSub').textContent=sub||'';show('bad');}

// 별점
(function(){
  var w=$('stars');
  for(var i=1;i<=5;i++){(function(n){
    var b=document.createElement('button');
    b.type='button'; b.textContent='★'; b.setAttribute('aria-label',n+'점');
    b.onclick=function(){STARS=n;
      [].forEach.call(w.children,function(el,idx){el.classList.toggle('on',idx<n);});
      $('send').disabled=!(STARS>0);};
    w.appendChild(b);
  })(i);}
})();

$('body').addEventListener('input',function(){$('cnt').textContent=this.value.length;});

$('send').onclick=async function(){
  if(sending)return;
  var body=$('body').value.trim();
  if(!STARS){$('err').textContent='별점을 선택해 주세요.';$('err').classList.remove('hide');return;}
  if(body.length<5){$('err').textContent='후기를 조금만 더 적어주세요.';$('err').classList.remove('hide');return;}
  sending=true; this.disabled=true; this.textContent='보내는 중…'; $('err').classList.add('hide');
  var r=await call({action:'submit',stars:STARS,body:body,name:$('name').value.trim()});
  if(r.ok&&r.data.ok){
    $('doneSub').textContent=(r.data.designer&&r.data.designer.name?r.data.designer.name+'님께 ':'')+'후기가 전달됐어요.';
    show('done'); return;
  }
  sending=false; this.disabled=false; this.textContent='후기 남기기';
  if(r.data&&r.data.used){bad('이미 후기를 남긴 링크예요','한 링크로는 한 번만 보낼 수 있어요.');return;}
  $('err').textContent=(r.data&&r.data.error)||'보내지 못했어요. 잠시 후 다시 시도해 주세요.';
  $('err').classList.remove('hide');
};

(async function(){
  if(!T){bad('주소가 올바르지 않아요','디자이너에게 받은 링크로 다시 들어와 주세요.');return;}
  var r=await call({action:'info'});
  if(!(r.ok&&r.data.ok)){
    var d=r.data||{};
    // 연결 실패는 링크 잘못이 아니다. 새로고침하면 되는 상황이라 그렇게 안내한다.
    if(r.offline) return bad('연결에 실패했어요', d.error);
    if(d.used)  return bad('이미 후기를 남긴 링크예요','한 링크로는 한 번만 보낼 수 있어요.');
    if(d.expired)return bad('만료된 링크예요','디자이너에게 새 링크를 요청해 주세요.');
    return bad('링크를 찾을 수 없어요',d.error||'주소를 다시 확인해 주세요.');
  }
  var g=r.data.designer||{};
  $('nm').textContent=g.name||'디자이너';
  $('ar').textContent=g.area||'';
  if(g.avatar&&/^https:\/\//i.test(g.avatar)) $('av').style.backgroundImage="url('"+encodeURI(g.avatar)+"')";
  $('send').disabled=true;
  show('form');
})();
</script>
</body>
</html>
